<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e3650"/>
      <stop offset="100%" stop-color="#1a2135"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="16%" r="75%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="512" height="512" rx="110" fill="url(#shine)"/>

  <!-- Asa izquierda -->
  <polyline points="134,125 134,176 179,176"
    stroke="rgba(255,255,255,0.95)" stroke-width="18"
    fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cuerpo del carrito -->
  <polyline points="179,176 211,304 378,304 399,207 179,207"
    stroke="rgba(255,255,255,0.95)" stroke-width="18"
    fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Barra interior decorativa -->
  <line x1="192" y1="256" x2="390" y2="256"
    stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.35"/>

  <!-- Rueda izquierda -->
  <circle cx="250" cy="355" r="34" fill="rgba(255,255,255,0.95)"/>
  <circle cx="250" cy="355" r="16" fill="#1f2840"/>

  <!-- Rueda derecha -->
  <circle cx="346" cy="355" r="34" fill="rgba(255,255,255,0.95)"/>
  <circle cx="346" cy="355" r="16" fill="#1f2840"/>
</svg>
